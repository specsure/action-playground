name: Design tokens
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tokens
        uses: specsure/dsgraph-action@v1
        with:
          path: tokens
          code: app
          fail-on: major
      - if: always()
        run: echo "level=${{ steps.tokens.outputs.level }} changes=${{ steps.tokens.outputs.changes }} breaking=${{ steps.tokens.outputs.breaking }} code-breaks=${{ steps.tokens.outputs.code-breaks }}"
